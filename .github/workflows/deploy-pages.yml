name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Godot web export is already committed to main
      # We just need to publish the repo root (or a subfolder) to Pages.
      - name: Add COOP/COEP headers via _headers (Cloudflare / Netlify)
        run: |
          cat > _headers << 'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          EOF

      # For GitHub Pages we need a headers workaround via a small service worker
      - name: Ensure coi-serviceworker is present
        run: |
          if [ ! -f coi-serviceworker.js ]; then
            curl -sL https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.js \
              -o coi-serviceworker.js
            echo "Downloaded coi-serviceworker.js"
          else
            echo "coi-serviceworker.js already present"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # deploy repo root (index.html lives here)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
